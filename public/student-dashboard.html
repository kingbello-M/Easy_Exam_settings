<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal · CUPE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav class="dash-nav">
        <div class="container dash-nav-inner">
            <a href="index.html" class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 2 2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                </div>
                <span class="brand-name">CUPE</span>
            </a>
            <div class="dash-nav-actions">
                <span class="dash-user" id="dash-user"></span>
                <div class="lang-switcher">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <span class="lang-divider"></span>
                    <button class="lang-btn" data-lang="fr">FR</button>
                </div>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <button class="btn btn-danger btn-sm" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <main class="dash-main">
        <div class="container dash-shell">

            <!-- SIDEBAR -->
            <aside class="dash-sidebar">
                <nav class="side-nav">
                    <button class="side-item active" data-panel="exams">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                        <span data-i18n="s_exams">Exams</span>
                    </button>
                    <button class="side-item" data-panel="results">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                        <span data-i18n="s_results">Results</span>
                    </button>
                    <button class="side-item" data-panel="messages">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span data-i18n="s_messages">Messages</span>
                        <span class="side-badge" id="msg-badge" style="display:none;">0</span>
                    </button>
                </nav>
            </aside>

            <div class="dash-content">

                <!-- EXAMS -->
                <section class="panel active" id="panel-exams">
                    <div class="dash-header">
                        <div>
                            <h1 data-i18n="st_exams_title">My Exams</h1>
                            <p class="section-sub" data-i18n="st_exams_sub">Available exams ready for you to take.</p>
                        </div>
                    </div>
                    <div class="card">
                        <table>
                            <thead><tr><th data-i18n="th_exam">Exam</th><th data-i18n="th_dur">Duration</th><th data-i18n="th_status">Status</th><th data-i18n="th_action">Action</th></tr></thead>
                            <tbody id="exams-table"><tr><td colspan="4" class="empty-state"><span data-i18n="loading">Loading…</span></td></tr></tbody>
                        </table>
                    </div>
                </section>

                <!-- RESULTS -->
                <section class="panel" id="panel-results">
                    <div class="dash-header">
                        <div>
                            <h1 data-i18n="res_title">My Results</h1>
                            <p class="section-sub" data-i18n="res_sub">Your published scores and AI feedback.</p>
                        </div>
                    </div>
                    <div class="card">
                        <table>
                            <thead><tr><th data-i18n="th_exam">Exam</th><th data-i18n="th_score">Score</th><th data-i18n="th_feedback">AI Feedback</th></tr></thead>
                            <tbody id="results-table"><tr><td colspan="3" class="empty-state"><span data-i18n="loading">Loading…</span></td></tr></tbody>
                        </table>
                    </div>
                </section>

                <!-- MESSAGES -->
                <section class="panel" id="panel-messages">
                    <div class="dash-header">
                        <div>
                            <h1 data-i18n="msg_title">Messages</h1>
                            <p class="section-sub" data-i18n="msg_sub">Messages from your teacher.</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="msg-list" id="inbox-list"><p class="empty-state"><span data-i18n="loading">Loading…</span></p></div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- EXAM TAKING MODAL -->
    <div class="modal-overlay" id="exam-modal">
        <div class="modal wide">
            <div class="modal-header">
                <h2 id="exam-modal-title"></h2>
                <button class="modal-close" id="exam-close">×</button>
            </div>
            <div class="exam-timer-bar" id="exam-timer-bar" style="display:none;">
                <span class="exam-timer-label" data-i18n="st_time_left">Time left</span>
                <span class="exam-timer" id="exam-timer">00:00</span>
            </div>
            <div id="exam-questions"></div>
            <p class="form-status" id="exam-status" role="status"></p>
            <button class="btn btn-primary btn-block btn-lg" id="exam-submit" data-i18n="submit_exam">Submit Exam</button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    <script src="js/student.js"></script>
</body>
</html>
